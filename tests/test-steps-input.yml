name: Test steps input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Simulate a prior step
        id: prior-step
        run: echo "Simulated step"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: success
          steps: ${{ toJson(steps) }}
      - name: Assert action ran with steps input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with steps input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no webhook URL configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
