name: Test custom message override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: success
          webhook-url: https://hooks.slack.com/services/FAKE/FAKE/FAKE
          message: "Custom test message from act workflow"
      - name: Assert action ran with custom message (fails gracefully without real webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real webhook provided)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real webhook URL)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
